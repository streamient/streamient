name: Build and Push Docker Image

on:
    workflow_dispatch:
        inputs:
            dry_run:
                description: "Build only, do not push to GHCR"
                required: false
                type: boolean
                default: true
env:
    GHCR_IMAGE: ghcr.io/streamient/streamient

jobs:
    build-and-push:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write

        steps:
            - name: Checkout
              uses: actions/checkout@v7

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v4

            - name: Extract metadata (tags, labels)
              id: meta
              uses: docker/metadata-action@v6
              with:
                  images: ${{ env.GHCR_IMAGE }}
                  tags: |
                      type=ref,event=tag
                      type=raw,value=latest

            - name: Login to GitHub Container Registry
              uses: docker/login-action@v4
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Build and push
              uses: docker/build-push-action@v7
              with:
                  context: .
                  file: docker/dockerfiles/prod.Dockerfile
                  platforms: linux/amd64
                  push: ${{ inputs.dry_run != true }}
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  provenance: false
                  build-args: |
                      APP_VERSION=${{ steps.meta.outputs.version }}
                      STREAMIENT_DOCS_VANITY_BASE=/
                  cache-from: type=gha
                  cache-to: type=gha,mode=max
            
            - uses: yanzay/notify-telegram@v0.1.0
              if: always()
              with:
                chat: ${{ secrets.TELEGRAM_CHAT_ID }}
                token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
                status: ${{ job.status }}

    create-release:
        needs: build-and-push
        if: ${{ !inputs.dry_run && startsWith(github.ref, 'refs/tags/202') }}
        runs-on: ubuntu-latest
        permissions:
            contents: write
            issues: read
            pull-requests: read
        steps:
            - name: Checkout tag
              uses: actions/checkout@v7
              with:
                  ref: ${{ github.ref }}
                  fetch-depth: 0

            - name: Create release if missing
              env:
                  GH_TOKEN: ${{ github.token }}
                  TAG: ${{ github.ref_name }}
              run: |
                  git rev-parse "refs/tags/$TAG"
                  if gh release view "$TAG" >/dev/null 2>&1; then
                    echo "Release $TAG already exists. Skipping."
                    exit 0
                  fi
                  node scripts/generate-release-notes.mjs > release-notes.md
                  gh release create "$TAG" --title "$TAG" --notes-file release-notes.md
