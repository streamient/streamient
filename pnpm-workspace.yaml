ignoreWorkspaceRootCheck: true
dangerouslyAllowAllBuilds: true
linkWorkspacePackages: deep
minimumReleaseAge: 0
peerDependencyRules:
  ignoreMissing:
    - bufferutil
    - utf-8-validate
packageExtensions:
  "@hyperdx/instrumentation-sentry-node@0.2.0":
    dependencies:
      "@opentelemetry/sdk-trace-base": 2.7.1
overrides:
  # The package ships prebuilt webfonts; its generator is not used by Streamient.
  "@tabler/icons-webfont>svgtofont": "-"
  bufferutil: ^4.1.0
  utf-8-validate: ^5.0.10
  "@tiptap/core": ^3.31.3
  "@tiptap/pm": ^3.31.3
  "@tiptap/extension-code-block": ^3.31.3
  react: 19.2.8
  react-dom: 19.2.8
  # vue@3.5.36 was published with workspace:* internal refs
  "vue@3.5.36>@vue/shared": 3.5.36
  "vue@3.5.36>@vue/compiler-dom": 3.5.36
  "vue@3.5.36>@vue/runtime-dom": 3.5.36
  "vue@3.5.36>@vue/compiler-sfc": 3.5.36
  "vue@3.5.36>@vue/server-renderer": 3.5.36
  "@vue/server-renderer@3.5.36>@vue/shared": 3.5.36
  "@vue/server-renderer@3.5.36>@vue/compiler-ssr": 3.5.36
  "@vue/server-renderer@3.5.36>vue": 3.5.36
packages:
  - "apps/*"
  - "docs"
patchedDependencies:
  connect-mongo@6.0.0: patches/connect-mongo@6.0.0.patch
